name: release

# Builds the Windows installer (with ffmpeg) and a portable zip when a version tag is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build minicut.exe
        shell: cmd
        run: build.bat

      - name: Download ffmpeg
        shell: pwsh
        run: ./installer/get-ffmpeg.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\minicut.iss
          Compress-Archive -Force -DestinationPath dist\MiniCut-portable.zip -Path minicut.exe,installer\ffmpeg\ffmpeg.exe,installer\ffmpeg\ffprobe.exe,installer\ffmpeg\ffplay.exe,installer\ffmpeg\LICENSE.txt,LICENSE,installer\THIRD-PARTY.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
